{% extends "app_colaboradores/base.html" %}

{% block title %}Colaboradores | teste{% endblock %}

{% block content %}
    <h1>Atualizar de Colaborador</h1>
    <section>
        <form method="post" action="{% url 'atualizar_colaborador' colaborador.id %}">
            {% csrf_token %}
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" value="{{ colaborador.nome }}">
            </div>
            <div>
                <label for="cpf">Cpf:</label>
                <input type="text" id="cpf" name="cpf" value="{{ colaborador.cpf_formatado }}">
            </div>
            <div>
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" value="{{ colaborador.data_nascimento|date:'Y-m-d' }}">
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ colaborador.email }}">
            </div>
            <button type="submit">Atualizar</button>
        </form>
    </section>
{% endblock %}
